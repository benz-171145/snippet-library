  function syncErrorText() {
    var code = (sync.error && sync.error.code) || '';
    if (code === 'permission-denied') return 'Firestore ปฏิเสธการเข้าถึง (permission-denied) — กรุณาตั้งค่า Firestore Rules ตามไฟล์ firestore.rules ที่อยู่ในโฟลเดอร์เดียวกัน แล้วรีเฟรชหน้านี้';
    if (code === 'not-found' || code === 'failed-precondition') return 'ยังไม่พบฐานข้อมูล Firestore ในโปรเจกต์นี้ — ไปที่ Firebase Console › Firestore Database › Create database แล้วรีเฟรชหน้านี้';
    return 'เชื่อมต่อ Firebase ไม่สำเร็จ (' + (code || (sync.error && sync.error.message) || 'unknown') + ') — กำลังแสดงข้อมูลสำเนาล่าสุดในเครื่อง';

  function renderSync() {

    var banner = '';
    if (sync.state === 'error') banner = bannerHTML('red', syncErrorText());
    else if (sync.mode === 'local') banner = bannerHTML('amber', 'โหลด Firebase ไม่สำเร็จ (อาจไม่มีอินเทอร์เน็ต) — ตอนนี้ทำงานในโหมดในเครื่อง การแก้ไขจะไม่ซิงค์ไปเครื่องอื่น กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรชเพื่อกลับมาซิงค์');

  /* =================================================================

     ================================================================= */
  function toast(message, type) {
    var el = document.createElement('div');
    el.className = 'anim-pop pointer-events-auto flex items-center gap-2 rounded-lg bg-zinc-900 text-white text-sm px-3.5 py-2.5 shadow-lg max-w-[90vw]';
    el.innerHTML = icon(type === 'error' ? 'alert' : 'okCircle', type === 'error' ? 'text-red-400' : 'text-emerald-400') + '<span></span>';
    el.lastChild.textContent = message;
    $('#toasts').appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
  }

          '<div class="flex items-start justify-between gap-4 px-5 sm:px-6 pt-5 pb-4 border-b border-zinc-100">' +
            '<div class="min-w-0"><h2 class="text-base font-semibold text-zinc-900 truncate">' + esc(o.title) + '</h2>' + (o.subtitle || '') + '</div>' +
            '<button data-action="close-modal" aria-label="ปิด" class="shrink-0 -mr-1 p-1.5 rounded-lg text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100">' + icon('x', '', 18) + '</button>' +
          '</div>' +
          '<div class="flex-1 overflow-y-auto scroll-thin px-5 sm:px-6 py-5">' + o.body + '</div>' +
          (o.footer ? '<div class="px-5 sm:px-6 py-4 border-t border-zinc-100 bg-zinc-50/60 sm:rounded-b-2xl flex flex-wrap items-center justify-end gap-2">' + o.footer + '</div>' : '') +
        '</div>' +
      '</div>';
  }
  function closeModal(skipReturn) {
    var m = modal;
    modal = null;
    $('#modalRoot').innerHTML = '';
    if (!skipReturn && m && m.returnTo && findSnippet(m.returnTo)) openUse(m.returnTo);
  }

  /* ---------- กรอกค่าตัวแปร + Live Preview ---------- */
  function openUse(id) {
    var s = findSnippet(id);
    if (!s) return;
    closeMore();
    modal = { type: 'use', id: id, content: s.content, title: s.title };
    var vars = extractVars(s.content);
    var vals = values[id] || {};

    var fields = vars.map(function (v, i) {
      var val = vals[v] || '';
      var input = isLongVar(v)
        ? '<textarea rows="5" data-var="' + esc(v) + '" placeholder="' + esc(varPlaceholder(v)) + '" class="var-input ' + FIELD + ' font-mono text-[13px] leading-relaxed resize-y scroll-thin">' + esc(val) + '</textarea>'
        : '<input type="text" data-var="' + esc(v) + '" value="' + esc(val) + '" placeholder="' + esc(varPlaceholder(v)) + '" class="var-input ' + FIELD + '">';
      return '<label class="block' + (i ? ' mt-3.5' : '') + '"><span class="flex flex-wrap items-center gap-2 mb-1.5">' +
        '<span class="text-[13px] font-medium text-zinc-700">' + esc(varLabel(v)) + '</span>' +
        '<code class="text-[11px] font-mono text-sky-700 bg-sky-50 px-1.5 rounded">{{' + esc(v) + '}}</code></span>' + input + '</label>';
    }).join('');

    var varsPanel = vars.length
      ? '<div><div class="flex items-center justify-between mb-3"><h3 class="text-xs font-semibold tracking-wide text-zinc-500">กรอกค่าตัวแปร</h3><span id="useCount" class="text-xs text-zinc-400"></span></div>' +
        '<div class="h-1 w-full bg-zinc-100 rounded-full mb-4 overflow-hidden"><div id="useBar" class="h-full bg-emerald-500 transition-all" style="width:0"></div></div>' + fields + '</div>'
      : '';
    var previewPanel =
      '<div class="min-w-0"><div class="flex items-center justify-between mb-3">' +
        '<h3 class="text-xs font-semibold tracking-wide text-zinc-500 flex items-center gap-1.5">' +
          '<span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>' +
          'ตัวอย่างผลลัพธ์ (Live Preview)</h3>' +
        '<span id="useChars" class="text-xs text-zinc-400"></span></div>' +
        '<pre id="usePreview" class="whitespace-pre-wrap break-words rounded-xl bg-zinc-50 ring-1 ring-inset ring-zinc-200 p-4 font-mono text-[13px] leading-relaxed text-zinc-700 max-h-[55vh] overflow-y-auto scroll-thin"></pre>' +
        (vars.length ? '' : '<p class="mt-3 text-xs text-zinc-400">รายการนี้ไม่มีตัวแปร กด "คัดลอกผลลัพธ์" เพื่อนำไปใช้ได้ทันที</p>') +
      '</div>';

    var subtitle = '<div class="mt-1.5 flex flex-wrap items-center gap-2">' + badge(s.category) +
      s.tags.map(function (t) { return '<span class="text-[11.5px] text-zinc-500">#' + esc(t) + '</span>'; }).join('') + '</div>' +
      (s.description ? '<p class="mt-2 text-[13px] text-zinc-500 leading-relaxed">' + esc(s.description) + '</p>' : '');

    showModal({
      size: vars.length ? 'lg' : 'md',
      title: s.title,
      subtitle: subtitle,
      body: vars.length ? '<div class="grid gap-6 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)]">' + varsPanel + previewPanel + '</div>' : previewPanel,
      footer:
        '<span class="mr-auto hidden sm:inline text-xs text-zinc-400">กด <kbd class="px-1.5 py-0.5 rounded border border-zinc-200 bg-white font-sans">Ctrl</kbd> + <kbd class="px-1.5 py-0.5 rounded border border-zinc-200 bg-white font-sans">Enter</kbd> เพื่อคัดลอก</span>' +
        '<button data-action="use-edit" class="' + btnCls('ghost') + '">' + icon('pencil', '', 15) + ' แก้ไข</button>' +
        (vars.length ? '<button id="useReset" data-action="use-reset" class="' + btnCls('secondary') + '">' + icon('reset', '', 15) + ' ล้างค่า</button>' : '') +
        '<button id="useCopy" data-action="use-copy" class="' + btnCls('primary', 'md', 'min-w-[150px]') + '">' + icon('copy', '', 15) + ' คัดลอกผลลัพธ์</button>'
    });
    updateUse();
    var first = document.querySelector('.var-input');
    if (first) setTimeout(function () { first.focus(); }, 30);
  }

  function updateUse() {
    if (!modal || modal.type !== 'use') return;
    var s = findSnippet(modal.id);
    var vals = values[modal.id] || {};
    var vars = extractVars(s.content);
    var filled = vars.filter(function (v) { return vals[v]; }).length;
    $('#usePreview').innerHTML = highlight(s.content, vals);
    $('#useChars').textContent = fillVars(s.content, vals).length.toLocaleString('th-TH') + ' ตัวอักษร';
    if (vars.length) {
      $('#useCount').textContent = 'กรอกแล้ว ' + filled + ' / ' + vars.length;
      $('#useBar').style.width = (filled / vars.length * 100) + '%';
      $('#useReset').disabled = filled === 0;
    }
  }

  function doCopy(text, unfilled) {
    return copyText(text).then(function (ok) {
      if (!ok) toast('ไม่สามารถเข้าถึงคลิปบอร์ดได้', 'error');
      else if (unfilled > 0) toast('คัดลอกแล้ว — ยังไม่ได้กรอกตัวแปร ' + unfilled + ' ตัว');
      else toast('คัดลอกไปยังคลิปบอร์ดแล้ว');
      return ok;
    });
  }

  function useCopy() {
    var s = findSnippet(modal.id);
    var vals = values[modal.id] || {};
    var unfilled = extractVars(s.content).filter(function (v) { return !vals[v]; }).length;
    doCopy(fillVars(s.content, vals), unfilled).then(function (ok) {
      var b = $('#useCopy');
      if (!ok || !b) return;
      b.className = btnCls('success', 'md', 'min-w-[150px]');
      b.innerHTML = icon('check', '', 15) + ' คัดลอกแล้ว!';
      setTimeout(function () {
        if (!b.isConnected) return;
        b.className = btnCls('primary', 'md', 'min-w-[150px]');
        b.innerHTML = icon('copy', '', 15) + ' คัดลอกผลลัพธ์';
      }, 1800);
    });
  }

  function quickCopy(id) {
    var s = findSnippet(id);
    if (!s) return;
    var vars = extractVars(s.content);
    var vals = values[id] || {};
    var unfilled = vars.filter(function (v) { return !vals[v]; }).length;
    if (vars.length && unfilled === vars.length) { openUse(id); return; } // ยังไม่กรอกเลย → เปิดฟอร์มกรอกค่าก่อน
    doCopy(fillVars(s.content, vals), unfilled).then(function (ok) {
      if (!ok) return;
      ui.copiedId = id;
      renderMain();
      setTimeout(function () { if (ui.copiedId === id) { ui.copiedId = null; renderMain(); } }, 1800);
    });
  }

  /* ---------- เพิ่ม / แก้ไข ---------- */
  function openEdit(id, returnTo) {
    var s = id ? findSnippet(id) : null;
    closeMore();
    var defaultCat = s ? s.category : (ui.category !== 'all' ? ui.category : 'ai');
    modal = { type: 'edit', returnTo: returnTo || null, draft: { id: s ? s.id : null, category: defaultCat, tags: s ? s.tags.slice() : [] } };

    var options = CATEGORIES.filter(function (c) { return c.id !== 'all'; }).map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === defaultCat ? ' selected' : '') + '>' + esc(c.label) + '</option>';
    }).join('');
    var label = function (forId, text, hint) {
      return '<label for="' + forId + '" class="block text-[13px] font-medium text-zinc-700 mb-1.5">' + text + (hint ? ' <span class="font-normal text-zinc-400">' + hint + '</span>' : '') + '</label>';
    };

    showModal({
      size: 'md',
      title: s ? 'แก้ไขรายการ' : 'เพิ่มรายการใหม่',
      body:
        '<div class="space-y-5">' +
          '<div>' + label('f-title', 'ชื่อรายการ') +
            '<input id="f-title" type="text" class="' + FIELD + '" placeholder="เช่น พรอมต์เขียนโครงร่างบทความ" value="' + esc(s ? s.title : '') + '"></div>' +
          '<div>' + label('f-cat', 'หมวดหมู่') +
            '<div class="relative">' +
              '<span id="catIcon" class="pointer-events-none absolute left-2 top-1/2 -translate-y-1/2">' + catIconBox(defaultCat, 'h-7 w-7', 14) + '</span>' +
              '<select id="f-cat" class="w-full h-11 appearance-none rounded-lg bg-white pl-11 pr-9 text-sm text-zinc-900 ring-1 ring-inset ring-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-900 cursor-pointer">' + options + '</select>' +
              '<span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400">' + icon('chevronDown', '', 16) + '</span>' +
            '</div>' +
            '<p id="catDesc" class="mt-1.5 text-xs text-zinc-400">' + esc(catOf(defaultCat).desc) + '</p></div>' +
          '<div>' + label('f-desc', 'คำอธิบาย', '(ไม่บังคับ)') +
            '<textarea id="f-desc" rows="2" class="' + FIELD + ' resize-y" placeholder="อธิบายสั้น ๆ ว่ารายการนี้ใช้ทำอะไร เพื่อให้ค้นหาง่ายขึ้น">' + esc(s ? s.description : '') + '</textarea></div>' +
          '<div>' + label('f-tag', 'แท็ก') +
            '<div id="tagBox" class="flex flex-wrap items-center gap-1.5 rounded-lg bg-white px-2 py-1.5 ring-1 ring-inset ring-zinc-200 focus-within:ring-2 focus-within:ring-zinc-900 min-h-[40px] cursor-text">' +
              '<span id="tagChips" class="contents"></span>' +
              '<input id="f-tag" type="text" autocomplete="off" class="flex-1 min-w-[140px] text-sm px-1 py-0.5 bg-transparent focus:outline-none placeholder:text-zinc-400">' +
            '</div>' +
            '<div id="tagSuggest" class="mt-2 flex flex-wrap gap-1.5"></div></div>' +
          '<div><div class="flex items-end justify-between mb-1.5">' + label('f-content', 'เนื้อหา').replace('mb-1.5', 'mb-0') +
              '<button type="button" data-action="insert-var" class="inline-flex items-center gap-1 text-xs font-medium text-sky-600 hover:text-sky-800">' + icon('braces', '', 13) + ' แทรกตัวแปร</button></div>' +
            '<textarea id="f-content" rows="11" class="' + FIELD + ' font-mono text-[13px] leading-relaxed resize-y scroll-thin" placeholder="พิมพ์พรอมต์ สูตร หรือเทมเพลตที่นี่&#10;ใช้ {{ชื่อตัวแปร}} สำหรับค่าที่ต้องการกรอกภายหลัง">' + esc(s ? s.content : '') + '</textarea>' +
            '<div id="detected" class="mt-2 flex flex-wrap items-center gap-1.5 text-xs text-zinc-500"></div></div>' +
        '</div>',
      footer:
        '<span id="editErr" class="mr-auto text-sm text-red-600 inline-flex items-center gap-1.5"></span>' +
        '<button data-action="close-modal" class="' + btnCls('secondary') + '">ยกเลิก</button>' +
        '<button data-action="edit-save" class="' + btnCls('primary') + '">' + icon('check', '', 15) + (s ? ' บันทึกการแก้ไข' : ' เพิ่มรายการ') + '</button>'
    });
    renderTagChips();
    renderTagSuggest();
    updateDetected();
    setTimeout(function () { var t = $('#f-title'); if (t) t.focus(); }, 30);
  }

  function renderTagChips() {
    var tags = modal.draft.tags;
    $('#tagChips').innerHTML = tags.map(function (t) {
      return '<span class="inline-flex items-center gap-1 text-[12px] bg-zinc-100 text-zinc-700 rounded-md pl-2 pr-1 py-0.5">#' + esc(t) +
        '<button type="button" data-action="tag-remove" data-tag="' + esc(t) + '" aria-label="ลบแท็ก" class="text-zinc-400 hover:text-zinc-800">' + icon('x', '', 12) + '</button></span>';
    }).join('');
    $('#f-tag').placeholder = tags.length ? '' : 'พิมพ์แท็กแล้วกด Enter';
  }
  function renderTagSuggest() {
    var q = normTag($('#f-tag').value);
    var list = tagCounts().map(function (tc) { return tc[0]; }).filter(function (t) {
      return modal.draft.tags.indexOf(t) === -1 && (!q || t.indexOf(q) !== -1);
    }).slice(0, 8);
    $('#tagSuggest').innerHTML = list.map(function (t) {
      return '<button type="button" data-action="tag-suggest" data-tag="' + esc(t) + '" class="text-[11.5px] px-2 py-0.5 rounded-md border border-dashed border-zinc-300 text-zinc-500 hover:border-zinc-500 hover:text-zinc-800">+ ' + esc(t) + '</button>';
    }).join('');
  }
  function addTag(raw) {
    var t = normTag(raw || '');
    if (t && modal.draft.tags.indexOf(t) === -1) modal.draft.tags.push(t);
    $('#f-tag').value = '';
    renderTagChips();
    renderTagSuggest();
  }
  function updateDetected() {
    var vars = extractVars($('#f-content').value);
    $('#detected').innerHTML = icon('wand', 'text-zinc-400', 13) + (vars.length
      ? '<span>ตรวจพบตัวแปร:</span>' + vars.map(function (v) { return '<code class="font-mono text-[11px] text-sky-700 bg-sky-50 ring-1 ring-sky-200 px-1.5 py-0.5 rounded">' + esc(v) + '</code>'; }).join('')
      : '<span>ยังไม่พบตัวแปร — ใส่ชื่อในรูปแบบ <code class="font-mono text-sky-600">{{ชื่อตัวแปร}}</code> เพื่อให้กรอกค่าได้ภายหลัง</span>');
  }
  function insertVariable() {
    var el = $('#f-content'), ph = '{{variable_name}}';
    var start = el.selectionStart, end = el.selectionEnd;
    el.value = el.value.slice(0, start) + ph + el.value.slice(end);
    el.focus();
    el.setSelectionRange(start + 2, start + ph.length - 2);
    updateDetected();
  }
  function saveEdit() {
    var title = $('#f-title').value.trim();
    var content = $('#f-content').value;
    var description = $('#f-desc').value.trim();
    var err = $('#editErr');
    if (!title) { err.innerHTML = icon('alert', '', 15) + 'กรุณากรอกชื่อรายการ'; $('#f-title').focus(); return; }
    if (!content.trim()) { err.innerHTML = icon('alert', '', 15) + 'กรุณากรอกเนื้อหา'; $('#f-content').focus(); return; }
    if ($('#f-tag').value.trim()) addTag($('#f-tag').value);

    var d = modal.draft, now = Date.now();
    d.category = $('#f-cat').value;
    var existing = d.id ? findSnippet(d.id) : null;
    commit([{
      id: d.id || uid(), title: title, description: description, category: d.category, tags: d.tags.slice(),
      content: content, createdAt: existing ? existing.createdAt : now, updatedAt: now
    }], []);
    toast(d.id ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มรายการใหม่แล้ว');
    closeModal();
  }

  /* ---------- ยืนยันการลบ / นำเข้า / คืนค่า ---------- */
  function openDelete(id) {
    var s = findSnippet(id);
    if (!s) return;
    modal = { type: 'delete', id: id };
    showModal({
      size: 'sm',
      title: 'ลบรายการนี้?',
      body: '<p class="text-sm text-zinc-600 leading-relaxed">“<span class="font-semibold text-zinc-900">' + esc(s.title) + '</span>” จะถูกลบออกจากคลังอย่างถาวร หากอาจต้องใช้ภายหลัง แนะนำให้ “ส่งออก JSON” เพื่อสำรองไว้ก่อน</p>',
      footer: '<button data-action="close-modal" class="' + btnCls('secondary') + '">ยกเลิก</button>' +
              '<button data-action="delete-confirm" class="' + btnCls('danger') + '">' + icon('trash', '', 15) + ' ลบ</button>'
    });
  }
  function confirmDelete() {
    var id = modal.id;
    delete values[id];
    save(VALUES_KEY, values);
    closeModal(true);
    commit([], [id]);
    toast('ลบรายการแล้ว');
  }

  function openImport(data) {
    modal = { type: 'import', data: data };
    showModal({
      size: 'sm',
      title: 'นำเข้าข้อมูลจากไฟล์ JSON',
      body: '<div class="flex items-start gap-3"><div class="h-10 w-10 shrink-0 rounded-lg bg-zinc-100 flex items-center justify-center text-zinc-500">' + icon('file', '', 18) + '</div>' +
        '<div class="text-sm text-zinc-600 space-y-2 leading-relaxed">' +
          '<p>ไฟล์ <span class="font-semibold text-zinc-900 break-all">' + esc(data.fileName) + '</span> มีทั้งหมด <span class="font-semibold text-zinc-900">' + data.items.length + '</span> รายการ</p>' +
          '<p><span class="font-semibold text-zinc-900">รวมข้อมูล</span> — เพิ่มเข้าไปในคลังเดิม (รายการที่ ID ซ้ำจะถูกอัปเดต)<br>' +
          '<span class="font-semibold text-zinc-900">แทนที่ทั้งหมด</span> — ลบรายการเดิม ' + snippets.length + ' รายการก่อนนำเข้า</p>' +
        '</div></div>',
      footer: '<button data-action="close-modal" class="' + btnCls('secondary') + '">ยกเลิก</button>' +
              '<button data-action="import-replace" class="' + btnCls('danger') + '">แทนที่ทั้งหมด</button>' +
              '<button data-action="import-merge" class="' + btnCls('primary') + '">รวมข้อมูล</button>'
    });
  }
  function applyImport(mode) {
    var d = modal.data;
    ui.category = 'all'; ui.tag = null;
    closeModal(true);
    if (mode === 'replace') {
      var keep = {};
      d.items.forEach(function (item) { keep[item.id] = true; });
      var removed = snippets.filter(function (s) { return !keep[s.id]; }).map(function (s) { return s.id; });
      values = d.values;
      commit(d.items, removed);
    } else {
      Object.keys(d.values).forEach(function (k) { values[k] = d.values[k]; });
      commit(d.items, []);
    }
    save(VALUES_KEY, values);
    toast('นำเข้า ' + d.items.length + ' รายการเรียบร้อย');
  }

  function openRestore() {
    closeMore();
    modal = { type: 'restore' };
    showModal({
      size: 'sm',
      title: 'คืนค่ารายการตัวอย่าง?',
      body: '<p class="text-sm text-zinc-600 leading-relaxed">รายการตัวอย่าง 8 รายการที่เคยลบไปจะถูกเพิ่มกลับเข้ามา ส่วนรายการที่คุณสร้างเองจะไม่ได้รับผลกระทบ</p>',
      footer: '<button data-action="close-modal" class="' + btnCls('secondary') + '">ยกเลิก</button>' +
              '<button data-action="restore-confirm" class="' + btnCls('primary') + '">คืนค่า</button>'
    });
  }
  function restoreSamples() {
    var missing = seedSnippets().filter(function (s) { return !findSnippet(s.id); });
    var added = missing.length;
    closeModal(true);
    if (added) commit(missing, []);
    toast(added ? 'คืนค่ารายการตัวอย่าง ' + added + ' รายการแล้ว' : 'รายการตัวอย่างครบอยู่แล้ว');
  }

  /* ---------- ส่งออก / นำเข้าไฟล์ ---------- */
  function exportJSON() {
    closeMore();
    var payload = { app: 'personal-snippet-library', version: 2, exportedAt: new Date().toISOString(), snippets: snippets, values: values };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'snippets-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('ส่งออก ' + snippets.length + ' รายการแล้ว');
  }

  $('#fileInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        var arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.snippets) ? parsed.snippets : null);
        if (!arr) throw new Error('format');
        var items = arr.map(normalizeSnippet).filter(Boolean);
        if (!items.length) throw new Error('empty');
        var vals = parsed && parsed.values && typeof parsed.values === 'object' && !Array.isArray(parsed.values) ? parsed.values : {};
        openImport({ items: items, values: vals, fileName: file.name });
      } catch (err) {
        toast('ไฟล์ JSON ไม่ถูกต้อง — ไม่พบรายการที่นำเข้าได้', 'error');
      }
    };
    reader.onerror = function () { toast('ไม่สามารถอ่านไฟล์ได้', 'error'); };
    reader.readAsText(file);
  });

  /* =================================================================
     Events
     ================================================================= */
  function closeMore() { $('#moreMenu').classList.add('hidden'); }

  var actions = {
    'noop': function () {},
    'open': function (el) { openUse(el.dataset.id); },
    'edit': function (el) { openEdit(el.dataset.id); },
    'delete': function (el) { openDelete(el.dataset.id); },
    'copy': function (el) { quickCopy(el.dataset.id); },
    'new': function () { openEdit(null); },
    'category': function (el) {
      ui.category = el.dataset.cat;
      renderAll();
      $('#main').scrollTop = 0;
      var pill = document.querySelector('#mobileCats [data-cat="' + ui.category + '"]');
      if (pill && pill.scrollIntoView) pill.scrollIntoView({ block: 'nearest', inline: 'center' });
    },
    'tag': function (el) { var t = el.dataset.tag; ui.tag = ui.tag === t ? null : t; renderAll(); },
    'clear-tag': function () { ui.tag = null; renderAll(); },
    'clear-cat': function () { ui.category = 'all'; renderAll(); },
    'clear-query': function () { setQuery(''); },
    'clear-all': function () { ui.tag = null; ui.category = 'all'; setQuery(''); renderAll(); },
    'export': exportJSON,
    'import': function () { closeMore(); $('#fileInput').click(); },
    'restore': openRestore,
    'sync-info': openSyncInfo,
    'more-toggle': function () { $('#moreMenu').classList.toggle('hidden'); },
    'close-modal': function () { closeModal(); },
    'use-copy': useCopy,
    'use-reset': function () {
      values[modal.id] = {};
      save(VALUES_KEY, values);
      Array.prototype.forEach.call(document.querySelectorAll('.var-input'), function (i) { i.value = ''; });
      updateUse();
      var f = document.querySelector('.var-input'); if (f) f.focus();
    },
    'use-edit': function () { var id = modal.id; closeModal(true); openEdit(id, id); },
    'edit-save': saveEdit,
    'tag-remove': function (el) {
      var t = el.dataset.tag;
      modal.draft.tags = modal.draft.tags.filter(function (x) { return x !== t; });
      renderTagChips(); renderTagSuggest(); $('#f-tag').focus();
    },
    'tag-suggest': function (el) { addTag(el.dataset.tag); $('#f-tag').focus(); },
    'insert-var': insertVariable,
    'delete-confirm': confirmDelete,
    'import-merge': function () { applyImport('merge'); },
    'import-replace': function () { applyImport('replace'); },
    'restore-confirm': restoreSamples
  };

  document.addEventListener('click', function (e) {
    // ปิดเมนู "เพิ่มเติม" เมื่อคลิกที่อื่น
    if (!e.target.closest('#moreMenu') && !e.target.closest('#moreBtn')) closeMore();
    if (e.target.id === 'tagBox') { $('#f-tag').focus(); return; }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var fn = actions[el.dataset.action];
    if (fn) fn(el, e);
  });
  // คลิกแท็กแนะนำแล้วไม่ให้ช่องพิมพ์เสียโฟกัส
  document.addEventListener('mousedown', function (e) {
    if (e.target.closest('[data-action="tag-suggest"]')) e.preventDefault();
  });

  $('#modalRoot').addEventListener('input', function (e) {
    var t = e.target;
    if (!modal) return;
    if (modal.type === 'use' && t.classList.contains('var-input')) {
      var vals = values[modal.id] || (values[modal.id] = {});
      vals[t.dataset.var] = t.value;
      save(VALUES_KEY, values);
      updateUse();
    } else if (modal.type === 'edit') {
      if (t.id === 'f-content') updateDetected();
      if (t.id === 'f-tag') renderTagSuggest();
      if (t.id === 'f-title' || t.id === 'f-content') $('#editErr').innerHTML = '';
    }
  });
  $('#modalRoot').addEventListener('change', function (e) {
    if (modal && modal.type === 'edit' && e.target.id === 'f-cat') {
      modal.draft.category = e.target.value;
      $('#catIcon').innerHTML = catIconBox(e.target.value, 'h-7 w-7', 14);
      $('#catDesc').textContent = catOf(e.target.value).desc;
    }
  });
  $('#modalRoot').addEventListener('focusout', function (e) {
    if (modal && modal.type === 'edit' && e.target.id === 'f-tag' && e.target.value.trim()) addTag(e.target.value);
  });

  function setQuery(q) {
    ui.query = q;
    var input = $('#search');
    if (input.value !== q) input.value = q;
    $('#searchClear').classList.toggle('hidden', !q);
    $('#searchHint').style.display = q ? 'none' : '';
    renderMain();
  }
  $('#search').addEventListener('input', function (e) { setQuery(e.target.value); });

  document.addEventListener('keydown', function (e) {
    var t = e.target, tag = (t.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable;

    if (modal) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (modal.type === 'use') useCopy();
        else if (modal.type === 'edit') saveEdit();
        return;
      }
      if (t.id === 'f-tag') {
        if ((e.key === 'Enter' || e.key === ',') && !e.isComposing) { e.preventDefault(); addTag(t.value); }
        else if (e.key === 'Backspace' && !t.value && modal.draft.tags.length) { modal.draft.tags.pop(); renderTagChips(); renderTagSuggest(); }
      }
      return;
    }

    if (e.key === 'Escape') {
      closeMore();
      if (t.id === 'search') { setQuery(''); t.blur(); }
      return;
    }
    if (typing) return;
    if (e.key === 'Enter' && t.classList && t.classList.contains('card')) { openUse(t.dataset.id); return; }
    if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
    else if ((e.key === 'n' || e.key === 'N' || e.key === 'ื') && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openEdit(null); }
  });

  /* =================================================================
     เริ่มต้น
     ================================================================= */
  $('#mobileLogo').innerHTML = icon('library', '', 16);
  $('#searchIcon').innerHTML = icon('search', '', 16);
  $('#searchClear').innerHTML = icon('x', '', 14);
  $('#newBtn').innerHTML = icon('plus', '', 16) + '<span class="hidden sm:inline">เพิ่มรายการใหม่</span>';
  $('#moreBtn').innerHTML = icon('more', '', 18);
  renderAll();
  renderSync();
  startCloud();

  // อัปเดตสถานะเมื่อเครือข่ายหลุด / กลับมา
  window.addEventListener('offline', function () {
    if (sync.mode === 'cloud' && sync.state !== 'error') { sync.state = 'offline'; renderSync(); }
  });
  window.addEventListener('online', function () {
    if (sync.mode === 'cloud' && sync.state === 'offline') { sync.state = 'connecting'; renderSync(); }
  });
  // ถ้าโหลดนานเกินไป (เช่น เน็ตช้า/ออฟไลน์) แสดงสำเนาล่าสุดในเครื่องไปก่อน
  setTimeout(function () {
    if (!ui.loading) return;
    ui.loading = false;
    snippets = loadCache() || legacyLocal || [];
    if (sync.mode === 'cloud' && sync.state === 'connecting') sync.state = navigator.onLine ? 'connecting' : 'offline';
    renderAll();
    renderSync();
  }, 8000);

  // ถ้าโหลด Tailwind จาก CDN ไม่ได้ (ไม่มีอินเทอร์เน็ต) แจ้งเตือนให้ทราบ — ฟังก์ชันทั้งหมดยังใช้งานได้
  if (!window.tailwind) {
    var warn = document.createElement('div');
    warn.setAttribute('style', 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#fff7ed;color:#9a3412;border-bottom:1px solid #fed7aa;padding:10px 16px;font:14px/1.5 "Leelawadee UI",Tahoma,sans-serif;text-align:center');
    warn.textContent = 'โหลด Tailwind CSS จากอินเทอร์เน็ตไม่สำเร็จ หน้าเว็บจึงยังไม่มีสไตล์ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรชหน้า (ข้อมูลและฟังก์ชันทั้งหมดยังใช้งานได้ตามปกติ)';
    document.body.appendChild(warn);
  }
})();
</script>
</body>
</html>
